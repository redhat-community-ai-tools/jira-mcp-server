[project]
name = "jira-mcp-server"
version = "1.0.0"
description = "JIRA operations via Model Context Protocol"
authors = [
    { name = "Your Organization", email = "team@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1.1",
    "fastmcp>=4.0.3",
    "jira>=3.10.5",
    "python-dotenv>=1.2.3",
    "fastapi>=0.141.1",
]

[project.scripts]
jira-mcp-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
